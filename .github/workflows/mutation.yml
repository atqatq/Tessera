name: mutation

# A3: mutation testing on the permission engine and the ledger. A mutant
# that survives means a test suite that cannot tell the code from a
# broken version of itself — that is a bug in the tests, and this job
# fails until it is fixed.
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    name: cargo-mutants · access + ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: install pinned toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2
        with:
          tool: cargo-mutants
      - name: no surviving mutants in the kernel crates
        run: cargo mutants --package tessera-access --package tessera-ledger --no-shuffle -v -j 2
      - name: publish survivors (only on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: survivors
          path: mutants.out/
