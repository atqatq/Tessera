name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default (also what OpenSSF Scorecard checks).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_PIN: "1.98.0"
  MSRV: "1.85.0"

jobs:
  core:
    name: rust · fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: install pinned toolchain
        run: |
          rustup toolchain install "$RUST_PIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_PIN"
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    # A4: MSRV declared and tested. The crate-level MSRV is 1.85.
    name: rust · msrv ${{ env.MSRV }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: install MSRV toolchain
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          rustup default "$MSRV"
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace

  matrix:
    # A4: Linux, macOS, Windows; x86_64 and aarch64. Native combos run the
    # full suite; cross combos at least compile for the target.
    name: rust · ${{ matrix.os }} · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            run-tests: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            run-tests: false
          - os: macos-latest
            target: aarch64-apple-darwin
            run-tests: true
          - os: macos-13
            target: x86_64-apple-darwin
            run-tests: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            run-tests: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: install pinned toolchain
        run: |
          rustup toolchain install "$RUST_PIN" --profile minimal --component clippy
          rustup default "$RUST_PIN"
        shell: bash
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          key: ${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}
      - run: cargo check --workspace --all-targets --target ${{ matrix.target }}
      - if: matrix.run-tests
        run: cargo test --workspace --target ${{ matrix.target }}

  coverage:
    # A3: coverage is a smoke detector with a floor, not a goal.
    name: rust · coverage ≥ 85% (kernel crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: install pinned toolchain with llvm-tools
        run: |
          rustup toolchain install "$RUST_PIN" --profile minimal --component llvm-tools-preview
          rustup default "$RUST_PIN"
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: measure and gate
        run: cargo llvm-cov --workspace --fail-under-lines 85 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcov
          path: lcov.info

  python:
    # Conformance: the reference and the vectors must agree, the vectors
    # must be current (regenerating produces no diff), and the package
    # must install the way the README says it does.
    name: python · reference + vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e reference/python
      - run: python -m unittest discover -s reference/python/tests -v
      - name: vectors are current (regeneration produces no diff)
        run: |
          python3 reference/python/tools/gen_vectors.py
          git diff --exit-code reference/python/vectors

  readme-commands:
    # C2/F.2: the README's commands run for real, and the checker fails
    # if an untested command ever appears on the front door.
    name: docs · README commands run for real
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: install pinned toolchain
        run: |
          rustup toolchain install "$RUST_PIN" --profile minimal
          rustup default "$RUST_PIN"
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 scripts/check_readme_commands.py
      - run: make setup
      - run: make test

  dco:
    # B2: DCO, not a CLA. Every commit in a PR must carry Signed-off-by.
    name: dco · sign-off present
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: every commit is signed off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          for sha in $(git rev-list "$base..$head"); do
            if ! git log -1 --format='%(trailers:key=Signed-off-by)' "$sha" | grep -q .; then
              echo "commit $sha is missing Signed-off-by"
              fail=1
            fi
          done
          exit $fail

  gitleaks:
    name: secrets · gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    # B2: permissive-only license allowlist, enforced.
    name: supply · cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --workspace

  reuse:
    # B3: REUSE-compliant SPDX coverage of every file, machine-checked.
    name: supply · reuse lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: fsfe/reuse-action@bb774aa972c2a89ff34781233d275075cbddf542 # v5

  cargo-audit:
    name: supply · cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
