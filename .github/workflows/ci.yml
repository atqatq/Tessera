name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust · fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # docs-first: green until the rust workspace lands, real checks then activate
      # (hashFiles is step-level only, so the gate lives in a step)
      - name: gate — rust workspace present?
        id: gate
        run: |
          if [ -n "$(find . -name Cargo.toml -not -path './.git/*' -print -quit)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: steps.gate.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.gate.outputs.present == 'true'
        run: cargo fmt --all -- --check
      - if: steps.gate.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: steps.gate.outputs.present == 'true'
        run: cargo test --workspace

  python-reference:
    name: python · reference + vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # docs-first: green until the reference implementation lands
      - name: gate — reference implementation present?
        id: gate
        run: |
          if [ -n "$(ls -A reference/python 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.present == 'true'
        run: pip install -e reference/python
      - if: steps.gate.outputs.present == 'true'
        run: pytest reference/python -q
      - name: conformance vectors vs schemas
        if: steps.gate.outputs.present == 'true'
        run: python reference/python/tools/check_manifests.py

  docs:
    name: docs · links & attribution check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: NOTICE + naming requirement present
        run: |
          grep -q "TESSERA NAMING REQUIREMENT" LICENSE
          grep -q "Powered by Tessera" NOTICE
          grep -q "Powered by Tessera" README.md
