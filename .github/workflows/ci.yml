#
# CI = the same gates as `make check`, split so a failure names its gate.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    name: docs - attribution + governance present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: NOTICE + naming requirement present
        run: |
          grep -q "TESSERA NAMING REQUIREMENT" LICENSE
          grep -q "Powered by Tessera" NOTICE
          grep -q "Powered by Tessera" README.md
      - name: governance documents present
        run: |
          test -f GOVERNANCE.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md

  reuse:
    name: reuse - SPDX licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  python-reference:
    name: python - reference + vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e reference/python
      - run: pytest reference/python -q
      - name: spoke manifests pass the independence gate
        run: python tools/check_manifests.py 'spokes/*/manifest.json'

  rust:
    name: rust - fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  dco:
    name: dco - every commit signed off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: DCO 1.1 sign-off present on all commits
        run: |
          missing=0
          for sha in $(git rev-list origin/main..HEAD 2>/dev/null || git rev-list HEAD --not --remotes=origin); do
            if ! git log -1 --format='%(trailers:key=Signed-off-by)' "$sha" | grep -q '.'; then
              echo "commit $sha is missing a Signed-off-by trailer"
              missing=1
            fi
          done
          exit $missing
