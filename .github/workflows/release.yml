name: release

# On a tagged release: SBOM, provenance attestation, keyless signature.
# SLSA posture is stated honestly in the README from whatever this
# workflow actually produces — never aspirationally.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build + attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # cosign keyless signing
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: install pinned toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo test --workspace
      - run: cargo build --workspace --release

      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2
        with:
          tool: cargo-cyclonedx
      - name: CycloneDX SBOM
        run: cargo cyclonedx --all --format json --output-path sbom

      - name: generate provenance attestation for the SBOM
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "sbom/**/*.cdx.json"

      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: sign release artefacts (keyless)
        run: |
          for f in target/release/tessera-*; do
            [ -x "$f" ] || continue
            cosign sign-blob --yes "$f" --output-signature "$f.sig" --bundle "$f.bundle"
          done

      - name: attach artefacts to the release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artefacts
          path: |
            sbom/
            target/release/tessera-*
