version: 2
# Dependabot: the two ecosystems this repo actually has. Weekly, so
# updates arrive in reviewable batches rather than a daily trickle.
# cargo-deny's duplicate ban keeps dependency drift visible either way.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /reference/python
    schedule:
      interval: weekly
