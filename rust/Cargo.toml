[workspace]
resolver = "2"
members = ["crates/scor-expr", "crates/scor-manifest", "crates/scor-policy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde-str"] }
thiserror = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Robustness gates. A panic in the hub takes down a spoke's dashboard, so
# the error paths have to be typed rather than assumed away.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "warn"
