# REUSE (https://reuse.software, SPDX v3) — machine-checked by CI.
# Every file in this repository is Apache-2.0 unless a more specific
# annotation below applies. Add an annotation for vendored third-party
# assets here, and a row in THIRD_PARTY_LICENSES.md.

version = 1

[[annotations]]
path = ["**/*"]
precedence = "override"
SPDX-FileCopyrightText = "2026 The Tessera Project"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = "2026 The Tessera Project"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["Cargo.lock"]
precedence = "override"
SPDX-FileCopyrightText = "2026 The Tessera Project"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["reference/python/vectors/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 The Tessera Project"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["brand/fonts/LICENSE.Inter.txt", "brand/fonts/LICENSE.JetBrainsMono.txt"]
precedence = "override"
SPDX-FileCopyrightText = "Inter: 2016-2024 The Inter Project Authors; JetBrains Mono: 2020-2024 The JetBrains Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["brand/fonts/InterVariable.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "2016-2024 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["brand/fonts/JetBrainsMono-Regular.woff2", "brand/fonts/JetBrainsMono-Medium.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "2020-2024 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"
