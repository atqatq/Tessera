[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-ref"
version = "0.1.0"
description = "Executable specification of the Tessera kernel: the Python reference behind the conformance vectors."
requires-python = ">=3.10"
dependencies = []
license = { text = "Apache-2.0" }

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["tessera_ref*"]
