#
# The executable specification: the Python reference implementation and
# its test suite. Standard library only at runtime; pytest is a test
# dependency.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-reference"
version = "0.1.0"
description = "Tessera executable specification - Python reference implementation"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The Tessera Project" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["scor_ref", "scor_ref.expr"]

[tool.pytest.ini_options]
# Makes `pytest reference/python -q` work from the repository root without
# installing, and keeps the same behaviour in CI after `pip install -e`.
pythonpath = ["."]
testpaths = ["tests"]
